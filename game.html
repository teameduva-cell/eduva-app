<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Golu-Bolu Quiz Battle — EDUVA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0f172a; color:#fff; min-height:100vh; overflow-x:hidden; }
.screen { display:none; min-height:100vh; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
.screen.active { display:flex; }
h1 { font-size:1.8rem; font-weight:900; text-align:center; letter-spacing:-0.5px; }
.sub { color:#94a3b8; font-size:0.85rem; font-weight:700; text-align:center; margin-top:4px; }

/* ===== MASCOT SVG CARDS ===== */
.vs-row { display:flex; align-items:center; gap:14px; margin:28px 0 8px; }
.mascot-card { background:#1e293b; border:3px solid #334155; border-radius:24px; padding:16px 14px 12px; width:148px; text-align:center; cursor:pointer; transition:transform .2s, border-color .2s; }
.mascot-card:hover { transform:translateY(-4px); }
.mascot-card.selected { border-color:#f59e0b; box-shadow:0 0 24px rgba(245,158,11,.35); transform:scale(1.05); }
.mascot-card svg { width:110px; height:110px; }
.m-name { font-weight:900; font-size:1.05rem; margin-top:8px; }
.m-tag { font-size:0.68rem; color:#94a3b8; font-weight:700; }
.vs-badge { font-weight:900; font-size:1.5rem; color:#f59e0b; text-shadow:0 0 16px rgba(245,158,11,.6); }
.golu-c { color:#2dd4bf; } .bolu-c { color:#a78bfa; }

/* idle animations */
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
.idle { animation:bounce 1.6s ease-in-out infinite; }
@keyframes happy { 0%{transform:scale(1)} 40%{transform:scale(1.18) rotate(-4deg)} 70%{transform:scale(1.1) rotate(3deg)} 100%{transform:scale(1)} }
.happy { animation:happy .6s ease; }
@keyframes sad { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
.sad { animation:sad .5s ease; filter:grayscale(.7); }

/* ===== BUTTONS ===== */
.btn { border:none; border-radius:999px; padding:15px 44px; font-size:1.05rem; font-weight:900; cursor:pointer; transition:transform .15s, opacity .2s; }
.btn:active { transform:scale(.95); }
.btn-amber { background:linear-gradient(135deg,#f59e0b,#f97316); color:#1c1005; box-shadow:0 6px 20px rgba(249,115,22,.4); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn-ghost { background:#1e293b; color:#94a3b8; font-size:.85rem; padding:11px 26px; }

/* ===== GAME UI ===== */
.topbar { width:100%; max-width:440px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.score-pill { background:#1e293b; border-radius:999px; padding:8px 16px; font-weight:900; font-size:.95rem; }
.streak { color:#f59e0b; }
.timer-wrap { width:100%; max-width:440px; height:10px; background:#1e293b; border-radius:999px; overflow:hidden; margin-bottom:16px; }
.timer-bar { height:100%; background:linear-gradient(90deg,#22c55e,#f59e0b); border-radius:999px; transition:width .1s linear, background .3s; }
.timer-bar.danger { background:#ef4444; }
.battle-arena { width:100%; max-width:440px; display:flex; align-items:center; gap:12px; background:#1e293b; border-radius:20px; padding:10px 14px; margin-bottom:16px; }
.arena-mascot { width:64px; height:64px; flex-shrink:0; }
.arena-mascot svg { width:100%; height:100%; }
.speech { flex:1; background:#0f172a; border-radius:14px; padding:10px 12px; font-size:.85rem; font-weight:700; min-height:52px; display:flex; align-items:center; }
.q-card { width:100%; max-width:440px; background:#1e293b; border-radius:20px; padding:18px; margin-bottom:14px; }
.q-num { font-size:.7rem; font-weight:900; color:#64748b; letter-spacing:1px; }
.q-text { font-size:1.02rem; font-weight:800; margin-top:6px; line-height:1.45; }
.opts { width:100%; max-width:440px; display:grid; gap:10px; }
.opt { background:#1e293b; border:2px solid #334155; border-radius:16px; padding:14px 16px; font-size:.95rem; font-weight:700; cursor:pointer; text-align:left; color:#fff; transition:all .15s; }
.opt:active { transform:scale(.97); }
.opt.correct { background:#14532d; border-color:#22c55e; }
.opt.wrong { background:#7f1d1d; border-color:#ef4444; }
.opt.dim { opacity:.45; }
@keyframes shakeX {0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.shake { animation:shakeX .4s; }

/* ===== RESULT ===== */
.result-score { font-size:3.4rem; font-weight:900; background:linear-gradient(135deg,#f59e0b,#f97316); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.result-msg { font-size:1rem; font-weight:800; margin:8px 0 20px; text-align:center; }
.result-mascot { width:150px; height:150px; margin-bottom:8px; }
.best-tag { font-size:.78rem; color:#94a3b8; font-weight:700; margin-bottom:20px; }
.promo { position:fixed; bottom:10px; font-size:.7rem; color:#475569; font-weight:700; text-align:center; width:100%; }
.promo a { color:#64748b; }
.lang-row { display:flex; gap:8px; margin-top:18px; }
.lang-btn { background:#1e293b; border:2px solid #334155; color:#94a3b8; border-radius:999px; padding:8px 20px; font-weight:900; font-size:.85rem; cursor:pointer; transition:all .2s; }
.lang-btn.active { border-color:#f59e0b; color:#f59e0b; background:rgba(245,158,11,.1); }
</style>
</head>

/* sound (WebAudio, no assets) */
let AC = null;
function beep(freq, dur, type) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.15, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch(e) {}
}
const sndCorrect = () => { beep(660,.15); setTimeout(()=>beep(880,.2),120); };
const sndWrong = () => beep(160,.3,'sawtooth');
const sndTick = () => beep(1000,.05,'square');

function selectTeam(t) {
  team = t; oppTeam = t === 'golu' ? 'bolu' : 'golu';
  document.getElementById('card-golu').classList.toggle('selected', t==='golu');
  document.getElementById('card-bolu').classList.toggle('selected', t==='bolu');
  document.getElementById('btn-start').disabled = false;
  beep(520,.1);
}

function startGame() {
  qList = QUESTIONS.slice().sort(()=>Math.random()-.5).slice(0,10);
  qIndex = 0; score = 0; streakN = 0;
  document.getElementById('score').textContent = '0';
  document.getElementById('streak').textContent = '0';
  document.getElementById('arena-mascot').innerHTML = team === 'golu' ? goluSVG() : boluSVG();
  document.getElementById('speech').textContent = SPEECH[team].start[LANG];
  showScreen('scr-game');
  loadQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function loadQuestion() {
  answered = false;
  const q = qList[qIndex];
  document.getElementById('qnow').textContent = qIndex + 1;
  document.getElementById('qnum').textContent = (LANG === 'hi' ? 'प्रश्न ' : 'QUESTION ') + (qIndex + 1);
  document.getElementById('qtext').textContent = q.q;
  const box = document.getElementById('opts'); box.innerHTML = '';
  q.o.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = opt;
    b.onclick = () => answer(i, b);
    box.appendChild(b);
  });
  // timer
  clearInterval(timerInt);
  timeLeft = 15;
  const bar = document.getElementById('timerbar');
  bar.classList.remove('danger'); bar.style.width = '100%';
  timerInt = setInterval(() => {
    timeLeft -= 0.1;
    bar.style.width = Math.max(0, (timeLeft/15)*100) + '%';
    if (timeLeft <= 5) bar.classList.add('danger');
    if (timeLeft <= 5 && Math.abs(timeLeft % 1) < 0.1) sndTick();
    if (timeLeft <= 0) { clearInterval(timerInt); timeout(); }
  }, 100);
}

function react(kind) {
  const m = document.getElementById('arena-mascot');
  const s = document.getElementById('speech');
  s.textContent = SPEECH[team][kind][LANG];
  m.classList.remove('happy','sad'); void m.offsetWidth;
  m.classList.add(kind === 'correct' ? 'happy' : 'sad');
  setTimeout(() => m.classList.remove('happy','sad'), 700);
}

function answer(i, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timerInt);
  const q = qList[qIndex];
  const opts = document.querySelectorAll('.opt');
  if (i === q.a) {
    streakN++;
    const pts = 10 + Math.min(streakN-1, 5) * 2; // streak bonus
    score += pts;
    btn.classList.add('correct');
    sndCorrect(); react('correct');
  } else {
    streakN = 0;
    btn.classList.add('wrong');
    opts[q.a].classList.add('correct');
    sndWrong(); react('wrong');
  }
  opts.forEach(o => o.classList.add('dim'));
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streakN;
  setTimeout(() => {
    qIndex++;
    if (qIndex < qList.length) loadQuestion();
    else endGame();
  }, 1300);
}

function timeout() {
  if (answered) return;
  answered = true;
  const q = qList[qIndex];
  const opts = document.querySelectorAll('.opt');
  opts[q.a].classList.add('correct');
  opts.forEach(o => o.classList.add('dim'));
  streakN = 0;
  document.getElementById('streak').textContent = '0';
  sndWrong(); react('timeout');
  setTimeout(() => {
    qIndex++;
    if (qIndex < qList.length) loadQuestion();
    else endGame();
  }, 1300);
}

let pendingDouble = false;
function endGame() {
  showScreen('scr-result');
  document.getElementById('final-score').textContent = score;
  document.getElementById('result-mascot').innerHTML = team === 'golu' ? goluSVG() : boluSVG();
  let msg;
  if (score >= 140) msg = T('resChamp');
  else if (score >= 100) msg = T('resGreat');
  else if (score >= 60) msg = T('resOk');
  else msg = T('resLow');
  document.getElementById('result-msg').textContent = msg;
  const best = Math.max(score, parseInt(localStorage.getItem('gb_best') || '0'));
  localStorage.setItem('gb_best', best);
  document.getElementById('best-tag').textContent = '🥇 Best Score: ' + best + '  •  Team ' + team.toUpperCase();
  pendingDouble = false;
}

function showAdForDouble() {
  if (pendingDouble) return;
  // 🔧 STEP 5 mein yahan asli AdMob rewarded ad lagega
  alert(T('adDemo'));
  score *= 2;
  pendingDouble = true;
  document.getElementById('final-score').textContent = score;
  const best = Math.max(score, parseInt(localStorage.getItem('gb_best') || '0'));
  localStorage.setItem('gb_best', best);
  document.getElementById('best-tag').textContent = '🥇 Best Score: ' + best + '  •  Team ' + team.toUpperCase() + '  •  2x applied!';
}

function resetToStart() {
  showScreen('scr-start');
  document.getElementById('btn-start').disabled = !team;
}
</script>
