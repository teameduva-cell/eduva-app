<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUVA - Your AI Learning Partner</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-100">
    <div class="container mx-auto px-4">
      <nav class="flex justify-between items-center py-4">
        <div class="logo text-2xl font-bold bg-gradient-to-r from-indigo-600 to-cyan-500 bg-clip-text text-transparent">
          EDUVA
        </div>
        <div class="hidden md:flex space-x-6">
          <a href="#home" class="nav-item hover:text-indigo-600 transition" data-view="home">Home</a>
          <a href="#chat" class="nav-item hover:text-indigo-600 transition" data-view="chat">Chat</a>
          <a href="#profile" class="nav-item hover:text-indigo-600 transition" data-view="profile">Profile</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8">
    
    <!-- Home View -->
    <div id="home-view" class="view">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold mb-4">Welcome to EDUVA</h1>
        <p class="text-gray-600">Your AI Learning Partner</p>
      </div>
      
      <div class="grid md:grid-cols-3 gap-6">
        <div class="card">
          <h3 class="text-xl font-bold mb-2">📚 Study Notes</h3>
          <p class="text-gray-600">Access quality study materials</p>
        </div>
        <div class="card">
          <h3 class="text-xl font-bold mb-2">🤖 AI Chat</h3>
          <p class="text-gray-600">Ask Edu Sir anything</p>
        </div>
        <div class="card">
          <h3 class="text-xl font-bold mb-2">📝 Mock Tests</h3>
          <p class="text-gray-600">Practice with NEET/JEE pattern tests</p>
        </div>
      </div>
    </div>

    <!-- Chat View -->
    <div id="chat-view" class="view hidden">
      <div class="chat-container">
        <div id="chat-messages" class="chat-messages">
          <div class="message ai-message">
            <p>👋 Hello! I'm Edu Sir. Ask me anything!</p>
          </div>
        </div>
        <div class="chat-input-area">
          <input 
            type="text" 
            id="chat-input" 
            class="chat-input" 
            placeholder="Ask Edu Sir..."
          >
          <button id="send-btn" class="btn btn-primary">
            <i class="fas fa-paper-plane"></i>
          </button>
          <button id="voice-btn" class="btn btn-secondary">
            <i class="fas fa-microphone"></i>
          </button>
          <input type="file" id="image-input" accept="image/*" class="hidden">
          <button onclick="document.getElementById('image-input').click()" class="btn btn-secondary">
            <i class="fas fa-image"></i>
          </button>
        </div>
        <div id="image-preview" class="hidden p-2"></div>
      </div>
    </div>

    <!-- Profile View -->
    <div id="profile-view" class="view hidden">
      <div class="card">
        <h2 class="text-2xl font-bold mb-4">Your Profile</h2>
        <div class="mb-4">
          <p class="text-gray-600">Streak: <span class="streak-count font-bold text-indigo-600">0</span> days 🔥</p>
        </div>
        <button onclick="clearChatHistory()" class="btn btn-secondary">
          Clear Chat History
        </button>
        <button onclick="logout()" class="btn btn-primary ml-2">
          Logout
        </button>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation (Mobile) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white shadow-lg">
    <div class="flex justify-around py-3">
      <button class="nav-item flex flex-col items-center" data-view="home">
        <i class="fas fa-home text-xl"></i>
        <span class="text-xs">Home</span>
      </button>
      <button class="nav-item flex flex-col items-center" data-view="chat">
        <i class="fas fa-comments text-xl"></i>
        <span class="text-xs">Chat</span>
      </button>
      <button class="nav-item flex flex-col items-center" data-view="profile">
        <i class="fas fa-user text-xl"></i>
        <span class="text-xs">Profile</span>
      </button>
    </div>
  </nav>

  <!-- Main JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
